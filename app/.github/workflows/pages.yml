# Deploy Practice Institute to GitHub Pages (project site at https://<user>.github.io/<repo>/).
# Repository Settings -> Pages -> Source: "GitHub Actions".
# If the app lives in a subfolder of the repository, set APP_DIR accordingly.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  APP_DIR: .

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ env.APP_DIR }}/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Check public API origin
        env:
          VITE_PI_API_BASE: ${{ vars.VITE_PI_API_BASE }}
        run: node scripts/check-pages-api.mjs
      - name: Build for the repository subpath
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_PI_API_BASE: ${{ vars.VITE_PI_API_BASE }}
      - name: Check student artifact
        run: npm run check:student-build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_PI_API_BASE: ${{ vars.VITE_PI_API_BASE }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ env.APP_DIR }}/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
